[project]
name = "docspec"
version = "0.12.2"
description = "Format-neutral bulk document acquisition, processing, segmentation, and release management"
requires-python = ">=3.12,<3.13"
dependencies = [
    "spicy-docs==0.54.0",
    "duckdb>=1.5.5,<2",
    "pyarrow>=25,<26",
    # One compiled engine owns payload acceptance and refusal diagnostics.
    "jsonschema-rs>=0.52,<1",
    "rulespec-artifacts==1.1.2",
    "msgspec>=0.21.1,<1",
    # The SQL extra runs the in-process write catalog (adapters/storage/in_process_catalog.py).
    "pyiceberg[sql-sqlite]==0.12.0",
]

[tool.uv]
# The two extras need incompatible ANTLR runtimes; see the dagster extra.
conflicts = [[{ extra = "dagster" }, { extra = "ocr-vlm" }]]

[tool.uv.sources]
rulespec-artifacts = { path = "vendor/rulespec_artifacts-1.1.2-py3-none-any.whl" }
spicy-docs = { path = "vendor/spicy_docs-0.54.0-py3-none-any.whl" }

[project.optional-dependencies]
# Shared rendering and the local macOS OCR example; other backends remain caller-selected.
ocr = ["spicy-docs[pdf,pdf-apple]==0.54.0"]
# Local Docling VLM options; importing core DocSpec remains dependency-light.
ocr-vlm = ["spicy-docs[pdf,pdf-docling,pdf-mlx]==0.54.0"]
http = [
    "httpx>=0.27,<1",
]
s3 = [
    "boto3>=1.34,<2",
]
tokens = [
    "tiktoken>=0.7,<1",
]
pdf = [
    "spicy-docs[pdf-pypdf]==0.54.0",
]
dagster = [
    "dagster>=1.13,<2",
    # Dagster's generated asset-selection parser needs the 4.10+ ATN format but
    # does not declare it. Docling's RapidOCR route (ocr-vlm) pins 4.9 through omegaconf.
    "antlr4-python3-runtime>=4.10",
]
[dependency-groups]
dev = [
    # Exercise the source adapter and retained Parquet example against the same
    # provider wheel. DuckDB and Arrow also power retained record storage.
    "spicy-docs[public-table]==0.54.0",
    "httpx>=0.27,<1",
    "pytest",
    "ruff>=0.12,<0.13",
    "hypothesis>=6,<7",
]

[project.scripts]
docspec = "docspec.entrypoint:main"

[build-system]
requires = ["uv_build<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -m 'not integration'"
testpaths = ["tests"]
markers = [
    "integration: live external-service verification",
]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    "docs",
]
