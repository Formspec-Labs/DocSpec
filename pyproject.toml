[project]
name = "docspec"
version = "0.3.0"
description = "Format-neutral bulk document acquisition, processing, segmentation, and release management"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.5.5,<2",
    "pyarrow>=25,<26",
    "jsonschema>=4.23,<5",
    # Required for the per-row acceptance check. Python jsonschema supplies
    # detailed refusal diagnostics; it is not an alternative execution mode.
    "jsonschema-rs>=0.52,<1",
    "rulespec-artifacts==1.0.12",
]

[tool.uv.sources]
rulespec-artifacts = { path = "vendor/rulespec_artifacts-1.0.12-py3-none-any.whl" }
spicy-docs = { path = "vendor/spicy_docs-0.7.0-py3-none-any.whl" }

[project.optional-dependencies]
spicy-docs = [
    "spicy-docs==0.7.0",
]
http = [
    "httpx>=0.27,<1",
]
s3 = [
    "boto3>=1.34,<2",
]
tokens = [
    "tiktoken>=0.7,<1",
]
pdf = [
    "pypdf>=5,<7",
]
dagster = [
    "dagster>=1.13,<2",
]
[dependency-groups]
dev = [
    # Exercise the source adapter and retained Parquet example against the same
    # provider wheel. DuckDB and Arrow also power retained record storage.
    "spicy-docs[public-table]==0.7.0",
    "httpx>=0.27,<1",
    # Optional accelerator for rulespec-artifacts' canonical encoder, which
    # imports it defensively and falls back to json.dumps when it is absent.
    # It sits in the group `uv run` already keeps self-consistent because a
    # build wants it; the artifacts wheel deliberately declares no extra for
    # it, so a consumer that wants the acceleration installs it here.
    "msgspec>=0.18,<1",
    "pytest",
    "ruff>=0.12,<0.13",
]

[project.scripts]
docspec = "docspec.entrypoint:main"

[build-system]
requires = ["uv_build<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -m 'not integration'"
testpaths = ["tests"]
markers = [
    "integration: live external-service verification",
]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    "docs",
]
