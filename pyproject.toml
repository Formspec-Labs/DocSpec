[project]
name = "docspec"
version = "0.2.0"
description = "Format-neutral bulk document acquisition, processing, segmentation, and release management"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
s3 = [
    "boto3>=1.34,<2",
]
pdf = [
    "pymupdf>=1.24,<2",
    "pypdf>=5,<7",
]
dagster = [
    "dagster>=1.13,<2",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff>=0.12,<0.13",
]

[project.scripts]
docspec = "docspec.cli:main"

[build-system]
requires = ["uv_build<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -m 'not integration'"
testpaths = ["tests"]
markers = [
    "integration: live external-service verification",
]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    "archive",
    "docs",
]
