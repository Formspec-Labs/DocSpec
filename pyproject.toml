[project]
name = "docspec"
version = "0.2.9"
description = "Format-neutral bulk document acquisition, processing, segmentation, and release management"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema>=4.23,<5",
    "rulespec-artifacts==1.0.9",
]

[tool.uv.sources]
rulespec-artifacts = { path = "vendor/rulespec_artifacts-1.0.9-py3-none-any.whl" }

[project.optional-dependencies]
fast = [
    "jsonschema-rs>=0.52,<1",
]
http = [
    "httpx>=0.27,<1",
]
s3 = [
    "boto3>=1.34,<2",
]
tokens = [
    "tiktoken>=0.7,<1",
]
pdf = [
    "pymupdf>=1.24,<2",
    "pypdf>=5,<7",
]
dagster = [
    "dagster>=1.13,<2",
]
[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "ijson>=3.3,<4",
    "jsonschema>=4.23,<5",
    "jsonschema-rs>=0.52,<1",
    "pytest",
    "ruff>=0.12,<0.13",
]

[project.scripts]
docspec = "docspec.entrypoint:main"

[build-system]
requires = ["uv_build<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -m 'not integration'"
testpaths = ["tests"]
markers = [
    "integration: live external-service verification",
]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    "docs",
]
