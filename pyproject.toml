[project]
name = "docspec"
version = "0.2.10"
description = "Format-neutral bulk document acquisition, processing, segmentation, and release management"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema>=4.23,<5",
    # Not an accelerator: the sole schema engine every catalog row passes
    # through in practice. jsonschema alone is ~116x slower on the source-item
    # schema (1,993 us/row against 17.1 us/row), which is the difference
    # between minutes and hours over a full corpus, and nothing announced which
    # engine a build had resolved. jsonschema stays as the refusal authority.
    # Same spelling and bound SpicySearch already declares.
    "jsonschema-rs>=0.52,<1",
    "rulespec-artifacts==1.0.11",
]

[tool.uv.sources]
rulespec-artifacts = { path = "vendor/rulespec_artifacts-1.0.11-py3-none-any.whl" }

[project.optional-dependencies]
http = [
    "httpx>=0.27,<1",
]
s3 = [
    "boto3>=1.34,<2",
]
tokens = [
    "tiktoken>=0.7,<1",
]
pdf = [
    "pymupdf>=1.24,<2",
    "pypdf>=5,<7",
]
dagster = [
    "dagster>=1.13,<2",
]
[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "ijson>=3.3,<4",
    "jsonschema>=4.23,<5",
    # Optional accelerator for rulespec-artifacts' canonical encoder, which
    # imports it defensively and falls back to json.dumps when it is absent.
    # It sits in the group `uv run` already keeps self-consistent because a
    # build wants it; the artifacts wheel deliberately declares no extra for
    # it, so a consumer that wants the acceleration installs it here.
    "msgspec>=0.18,<1",
    "pytest",
    "ruff>=0.12,<0.13",
]

[project.scripts]
docspec = "docspec.entrypoint:main"

[build-system]
requires = ["uv_build<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -m 'not integration'"
testpaths = ["tests"]
markers = [
    "integration: live external-service verification",
]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    "docs",
]
