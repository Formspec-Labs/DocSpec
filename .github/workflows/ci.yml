name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: "0.11.x"

      - name: Install Python
        run: uv python install 3.12

      - name: Verify dependency lock
        run: uv lock --check

      - name: Install core and development dependencies
        # These extras exercise native Dagster workers and local S3 SDK retries.
        # Isolated package tests separately check the core without extras.
        run: uv sync --frozen --extra dagster --extra s3

      - name: Check source and machine files
        run: uv run --frozen --extra dagster --extra s3 ruff check .

      - name: Run regression checks once and retain pytest evidence
        env:
          PYTEST_ADDOPTS: ""
        shell: bash
        run: |
          set -o pipefail
          uv run --frozen --extra dagster --extra s3 python tools/with_iceberg.py pytest --require-regression-map \
            --junitxml="$RUNNER_TEMP/pytest.xml" 2>&1 | tee "$RUNNER_TEMP/pytest.log"
          test -s "$RUNNER_TEMP/pytest.xml"

      - name: Build distributions
        run: uv build --out-dir dist

      - name: Verify the wheel in an empty environment
        shell: bash
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/docspec-wheel"
          # The pinned Rulespec dependency is vendored and not on the public
          # package index. Supply that wheel explicitly in this empty venv.
          uv pip install --python "$RUNNER_TEMP/docspec-wheel/bin/python" vendor/rulespec_artifacts-*.whl vendor/spicy_docs-*.whl dist/docspec-*.whl
          "$RUNNER_TEMP/docspec-wheel/bin/python" -c "import docspec"
          "$RUNNER_TEMP/docspec-wheel/bin/docspec" --help

      - name: Retain regression evidence and built wheels
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-${{ github.sha }}
          path: |
            ${{ runner.temp }}/pytest.xml
            ${{ runner.temp }}/pytest.log
            uv.lock
            dist/*.whl
