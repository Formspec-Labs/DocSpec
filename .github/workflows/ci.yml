name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: "0.11.x"

      - name: Install Python
        run: uv python install 3.12

      - name: Verify dependency lock
        run: uv lock --check

      - name: Install core and development dependencies
        # --extra dagster is required so tests/test_dagster_adapter.py's one real
        # native-execution test (gated only by `pytest.importorskip("dagster")`) runs
        # here instead of silently skipping; core install itself stays
        # dependency-free, as verified below in the empty-environment wheel check.
        run: uv sync --frozen --extra dagster

      - name: Check source and machine files
        run: uv run ruff check .

      - name: Run the default suite
        run: uv run pytest

      - name: Record required-selector conformance evidence
        # conformance/specification.json honestly declares "not-yet-conformant": 23 of
        # 25 required tests are implemented today; SCALE and PACKAGE-RELEASE remain
        # partial, and both need evidence CI cannot produce -- the ordered scale
        # campaigns and a published package. `conformance run`
        # exits non-zero on anything but a full "pass" verdict, so this step does not
        # gate merges (continue-on-error) — its job is to make the verdict a fact that
        # is recomputed and visible on every push, instead of a stale local claim
        # nobody runs. Drop continue-on-error once the matrix reaches "pass".
        run: >
          uv run docspec conformance run
          --root .
          --specification conformance/specification.json
          --matrix conformance/test-matrix.json
          --output "$RUNNER_TEMP/conformance-report.json"
          --class core
        continue-on-error: true

      - name: Build distributions
        run: uv build --out-dir dist

      - name: Verify the wheel in an empty environment
        shell: bash
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/docspec-wheel"
          uv pip install --python "$RUNNER_TEMP/docspec-wheel/bin/python" dist/docspec-*.whl
          "$RUNNER_TEMP/docspec-wheel/bin/python" -c "import docspec"
          "$RUNNER_TEMP/docspec-wheel/bin/docspec" --help
