name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: "0.11.x"

      - name: Install Python
        run: uv python install 3.12

      - name: Verify dependency lock
        run: uv lock --check

      - name: Install core and development dependencies
        # --extra dagster is required so tests/test_dagster_adapter.py's one real
        # native-execution test (gated only by `pytest.importorskip("dagster")`) runs
        # here instead of silently skipping; core install itself stays
        # dependency-free, as verified below in the empty-environment wheel check.
        run: uv sync --frozen --extra dagster

      - name: Check source and machine files
        run: uv run --frozen --extra dagster ruff check .

      - name: Run the default suite
        run: uv run --frozen --extra dagster pytest

      - name: Record required-selector conformance evidence
        # The required matrix retains partial items even when their selectors pass.
        # Some evidence, including ordered scale campaigns and a published package,
        # cannot come from this CI job. `conformance run` exits nonzero until every
        # required item passes with complete evidence. Record that verdict on each
        # push; drop continue-on-error once the matrix reaches "pass".
        run: >
          uv run --frozen --extra dagster docspec conformance run
          --root .
          --specification conformance/specification.json
          --matrix conformance/test-matrix.json
          --output "$RUNNER_TEMP/conformance-report.json"
          --class core
        continue-on-error: true

      - name: Build distributions
        run: uv build --out-dir dist

      - name: Verify the wheel in an empty environment
        shell: bash
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/docspec-wheel"
          # The pinned Rulespec dependency is vendored and not on the public
          # package index. Supply that wheel explicitly in this empty venv.
          uv pip install --python "$RUNNER_TEMP/docspec-wheel/bin/python" vendor/rulespec_artifacts-*.whl dist/docspec-*.whl
          "$RUNNER_TEMP/docspec-wheel/bin/python" -c "import docspec"
          "$RUNNER_TEMP/docspec-wheel/bin/docspec" --help
